# fly deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile   (run from the repo root)
app = "redactd-api"
primary_region = "lhr"

[deploy]
  release_command = "alembic upgrade head"

[env]
  PRELOAD_MODES = "thorough"
  MODEL_THREADS = "2"
  MAX_CONCURRENT_RUNS = "2"
  LOG_FORMAT = "json"
# secrets (fly secrets set ...): DATABASE_URL, REDIS_URL, IP_SALT, ALLOWED_ORIGINS

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 6
    hard_limit = 12
  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  cpu_kind = "performance"
  cpus = 4
  memory = "8gb"
