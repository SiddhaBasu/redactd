[alembic]
script_location = alembic
# The URL comes from DATABASE_URL (see alembic/env.py); nothing is configured here on purpose.
[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
